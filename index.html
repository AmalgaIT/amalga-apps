<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Amalga Apps</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#006E75">
<link rel="icon" type="image/png" href="icons/amalga-app-192.png">
<link rel="apple-touch-icon" href="icons/amalga-app-180.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#006E75;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;align-items:center;justify-content:center;padding:28px}
main{width:100%;max-width:420px;text-align:center}
main>img{width:72px;height:72px;border-radius:18px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
h1{font-size:22px;font-weight:600;margin:16px 0 6px}
main>p{margin:0 0 22px;opacity:.85;font-size:14px}
a.app{display:flex;align-items:center;gap:14px;background:#fff;color:#0f2b2d;text-decoration:none;border-radius:16px;padding:16px 18px;margin-bottom:12px;text-align:left;box-shadow:0 8px 24px rgba(0,0,0,.12)}
a.app b{display:block;font-size:16px}
a.app span{font-size:13px;color:#4b6466}
a.app i{margin-left:auto;font-style:normal;color:#006E75;font-size:20px}
.tip{font-size:12.5px;opacity:.85;line-height:1.5;margin-top:18px}
</style>
</head>
<body>
<main>
  <img src="icons/amalga-app-192.png" alt="">
  <h1>Amalga Apps</h1>
  <p>Open an app, then add it to your home screen.</p>
  <a class="app" href="hub/"><span><b>One HUB</b><span>Goals, time off, shifts, tickets, news and team tools</span></span><i>&rsaquo;</i></a>
  <a class="app" href="portal/"><span><b>Agent Portal</b><span>Your records, tickets and news</span></span><i>&rsaquo;</i></a>
  <div class="tip">Android: Chrome menu &rsaquo; Add to home screen &rsaquo; Install.<br>iPhone: Safari Share &rsaquo; Add to Home Screen.</div>
</main>
</body>
</html>
