<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Amalga People Hub</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#006E75">
<meta name="apple-mobile-web-app-title" content="People Hub">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="../icons/amalga-app-192.png">
<link rel="apple-touch-icon" href="../icons/amalga-app-180.png">
<style>
:root{--teal:#006E75;--ink:#0f2b2d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#app{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff;visibility:hidden}
#app.on{visibility:visible}
#cover{position:fixed;inset:0;background:var(--teal);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;transition:opacity .25s;z-index:2}
#cover.gone{opacity:0;pointer-events:none}
#cover img{width:88px;height:88px;border-radius:22px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#cover h1{font-size:20px;font-weight:600;margin:0;letter-spacing:.2px}
.spin{width:26px;height:26px;border:3px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:s .8s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
.card{background:#fff;color:var(--ink);border-radius:16px;padding:20px;max-width:340px;box-shadow:0 10px 30px rgba(0,0,0,.2);text-align:left}
.card b{display:block;font-size:16px;margin-bottom:6px}
.card p{margin:0 0 14px;font-size:14px;line-height:1.45;color:#3d5557}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{appearance:none;border:0;border-radius:10px;padding:10px 14px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
.btn.p{background:var(--teal);color:#fff}
.btn.o{background:#fff;color:var(--teal);border:1.5px solid var(--teal)}
</style>
</head>
<body>
<iframe id="app" title="Amalga People Hub" allow="clipboard-read; clipboard-write; camera; microphone; geolocation; fullscreen"></iframe>
<div id="cover"><img src="../icons/amalga-app-192.png" alt=""><h1>Amalga People Hub</h1><div class="spin" id="spin"></div><div id="msg"></div></div>
<script>
// ============ SETTINGS ============
// Paste the web app link from Apps Script › Deploy › Manage deployments (it ends in /exec).
var APP_URL = 'https://script.google.com/a/macros/amalgagroup.com/s/AKfycbxFmdQHDX9GnGhq-THtvXhSBzbswEiBzEwR-kVZdzxuNb-1LCWAGbMXHOZKr4AZSCK3/exec';
// ==================================
var APP_KEY = 'hub', NEEDS_GOOGLE_SIGNIN = true, WAIT_SECONDS = 20;
var HELP_TITLE = "People Hub didn’t open here", HELP_TEXT = "Make sure Chrome is signed in to your @amalgagroup.com Google account. If you have more than one account on this phone, make the Amalga one the first. Then try again.";
(function () {
  var frame = document.getElementById('app'), cover = document.getElementById('cover'),
      msg = document.getElementById('msg'), spin = document.getElementById('spin');
  var iOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var installed = (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
  var target = APP_URL + (location.search || '');   // links like ?tk=TICKET carry through
  var ready = false, timer = null;
  function card(title, text, buttons) {
    spin.style.display = 'none';
    msg.innerHTML = '<div class="card"><b>' + title + '</b><p>' + text + '</p><div class="btns">' + buttons + '</div></div>';
    cover.classList.remove('gone');
  }
  var openBtn = function (label) { return '<a class="btn p" href="' + target + '" target="_blank" rel="noopener">' + label + '</a>'; };
  var retryBtn = '<button class="btn o" onclick="location.reload()">Try again</button>';

  if (!/^https:\/\/script\.google\.com\//.test(APP_URL)) {
    card('Almost ready', 'Paste the Apps Script web app link (it ends in /exec) into APP_URL at the top of this page’s script.', '');
    return;
  }
  // iPhone and iPad block Google sign-in inside other sites, so People Hub runs from Safari there.
  if (NEEDS_GOOGLE_SIGNIN && iOS) {
    if (!installed) { location.replace(target); return; }
    card('On iPhone, People Hub runs from Safari', 'Open it, then tap Share › Add to Home Screen to keep it on your home screen.', openBtn('Open People Hub'));
    return;
  }
  // The app tells us it loaded (one line at the top of its page). Until then the cover stays up.
  window.addEventListener('message', function (e) {
    if (!e.data || e.data.amalgaApp !== APP_KEY) return;
    var host = ''; try { host = new URL(e.origin).hostname; } catch (x) {}
    if (!/\.googleusercontent\.com$/.test(host) && !/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
    ready = true; clearTimeout(timer);
    frame.classList.add('on'); cover.classList.add('gone');
  });
  frame.src = target;
  timer = setTimeout(function () { if (!ready) card(HELP_TITLE, HELP_TEXT, retryBtn + openBtn('Open in browser')); }, WAIT_SECONDS * 1000);
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () {});
})();
</script>
</body>
</html>
